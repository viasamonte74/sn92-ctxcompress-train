[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccslm"
version = "0.1.0"
description = "A specialised Granite 4.0 H Micro for the Microtensor ctx_compress arena: data, targets, training, pruning, quantisation, evaluation and packaging"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    "tokenizers>=0.19",
    "safetensors>=0.4",
    "transformers>=4.56",
    "peft>=0.15",
    "accelerate>=0.34",
    "torch>=2.4",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ccslm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
